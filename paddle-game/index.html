<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paddle Ball Game</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      background-color: black;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    #gameCanvas {
      background-color: black;
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas" width="600" height="300"></canvas>

  <!-- Shared pure physics helpers (also used by the property-based tests). -->
  <script src="physics.js"></script>
  <script>
    // Paddle ball game. Rendering + input live here; the pure ball/collision
    // logic lives in physics.js (shared with the property-based tests).
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // --- Configuration constants (from customization preferences) ---
    const PADDLE_WIDTH = 10;   // paddle thickness in pixels
    const PADDLE_HEIGHT = 80;  // paddle length in pixels
    const PADDLE_SPEED = 5;    // paddle movement speed (pixels per frame)
    const BALL_SPEED = 4;      // ball velocity magnitude per axis
    const AI_DIFFICULTY = 0.7; // left-paddle AI responsiveness (0-1): fraction of the gap closed per frame

    // Colors
    const BALL_COLOR = 'white';
    const PADDLE_COLOR = 'green';
    const BACKGROUND_COLOR = 'black';

    // Ball radius in pixels (reused by the drawing and later collision logic).
    const BALL_RADIUS = 8;

    // --- Scoreboard / win condition (customization: "First to 5 wins") ---
    const WINNING_SCORE = 5;      // first side to reach this score wins
    const SCORE_COLOR = 'white';  // score numbers
    const ACCENT_COLOR = 'green'; // box borders / accents (matches theme)

    // --- Ball state ---
    // Position starts centered on the 600x300 canvas.
    let ballX = canvas.width / 2;   // 300
    let ballY = canvas.height / 2;  // 150
    // Speed (direction set by resetBall()).
    let ballDX = BALL_SPEED;
    let ballDY = BALL_SPEED;

    // --- Paddle state ---
    // Vertical top position of each paddle, centered on the canvas.
    let leftPaddleY = (canvas.height - PADDLE_HEIGHT) / 2;   // 110
    let rightPaddleY = (canvas.height - PADDLE_HEIGHT) / 2;  // 110

    // --- Score / game state ---
    let leftScore = 0;   // computer (left paddle)
    let rightScore = 0;  // player (right paddle)
    let gameOver = false;
    let winner = null;   // 'left' | 'right' | null

    // --- Timer state ---
    // Elapsed game time in seconds, measured from game start and frozen on game
    // over. We track a start timestamp plus how long we've been paused/stopped.
    let gameStartTime = Date.now();
    let frozenElapsedMs = 0; // elapsed time captured when the game ended

    // --- Particle state (scoring burst effect) ---
    let particles = [];

    // --- Audio (paddle-hit sound effect) ---
    // Lazily created on the first user gesture to satisfy browser autoplay
    // policies. See ensureAudio().
    let audioCtx = null;

    // --- Player input state ---
    // Track whether each arrow key is currently held so the paddle moves
    // smoothly while a key is down. Supports Requirement 1.1 and 1.2.
    let upPressed = false;
    let downPressed = false;

    // Lazily create (or resume) the Web Audio context. Browsers block audio
    // until a user gesture, so we call this from the keydown handler. Returns
    // the context, or null if the Web Audio API is unavailable.
    function ensureAudio() {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) {
        return null;
      }
      if (!audioCtx) {
        audioCtx = new AudioCtx();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    // Play a short beep for a paddle hit using an oscillator (no audio files).
    function playBeep() {
      const ctxAudio = ensureAudio();
      if (!ctxAudio) {
        return;
      }
      const osc = ctxAudio.createOscillator();
      const gain = ctxAudio.createGain();
      osc.type = 'square';
      osc.frequency.value = 440; // A4
      // Quick fade so the beep is a short, soft blip rather than a click.
      gain.gain.setValueAtTime(0.0001, ctxAudio.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.15, ctxAudio.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctxAudio.currentTime + 0.12);
      osc.connect(gain);
      gain.connect(ctxAudio.destination);
      osc.start();
      osc.stop(ctxAudio.currentTime + 0.12);
    }

    // Spawn a short-lived burst of particles near (x, y) for a scoring effect.
    function spawnParticles(x, y) {
      const count = 16;
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count;
        const speed = 1.5 + Math.random() * 2.5;
        particles.push({
          x: x,
          y: y,
          dx: Math.cos(angle) * speed,
          dy: Math.sin(angle) * speed,
          life: 25 + Math.floor(Math.random() * 15), // frames
        });
      }
    }

    // Reset the whole match: scores, timer, particles, and the ball.
    function restartGame() {
      leftScore = 0;
      rightScore = 0;
      gameOver = false;
      winner = null;
      particles = [];
      gameStartTime = Date.now();
      frozenElapsedMs = 0;
      resetBall();
    }

    // Set the held flag on keydown. Call preventDefault() for the arrow keys
    // so pressing them doesn't scroll the page.
    window.addEventListener('keydown', (event) => {
      // Any keydown is a valid user gesture to unlock/resume audio.
      ensureAudio();

      // When the match is over, Space or Enter starts a new game.
      if (gameOver && (event.key === ' ' || event.key === 'Enter')) {
        event.preventDefault();
        restartGame();
        return;
      }

      if (event.key === 'ArrowUp') {
        upPressed = true;
        event.preventDefault();
      } else if (event.key === 'ArrowDown') {
        downPressed = true;
        event.preventDefault();
      }
    });

    // Clear the held flag on keyup (and still prevent default scrolling).
    window.addEventListener('keyup', (event) => {
      if (event.key === 'ArrowUp') {
        upPressed = false;
        event.preventDefault();
      } else if (event.key === 'ArrowDown') {
        downPressed = false;
        event.preventDefault();
      }
    });

    // Re-center the ball and give it a new random direction.
    // Supports Requirement 2.3 (ball reset when it goes off screen).
    function resetBall() {
      const dx = BALL_SPEED * (Math.random() < 0.5 ? -1 : 1);
      const dy = BALL_SPEED * (Math.random() < 0.5 ? -1 : 1);
      const reset = Physics.centerBall(physicsConfig(), dx, dy);
      ballX = reset.x;
      ballY = reset.y;
      ballDX = reset.dx;
      ballDY = reset.dy;
    }

    // Build the config object the pure physics helpers expect from the current
    // canvas size, ball radius, and paddle positions/dimensions.
    function physicsConfig() {
      return {
        width: canvas.width,
        height: canvas.height,
        radius: BALL_RADIUS,
        paddleWidth: PADDLE_WIDTH,
        paddleHeight: PADDLE_HEIGHT,
        leftPaddleY: leftPaddleY,
        rightPaddleY: rightPaddleY,
      };
    }

    // Move the player's right paddle based on the currently held arrow keys,
    // then clamp it so it stays fully on screen. ArrowUp moves the paddle up
    // (smaller Y), ArrowDown moves it down (larger Y). Supports Requirements
    // 1.1 and 1.2; clamping keeps the paddle within the canvas bounds.
    function movePlayer() {
      if (upPressed) {
        rightPaddleY -= PADDLE_SPEED;
      }
      if (downPressed) {
        rightPaddleY += PADDLE_SPEED;
      }
      rightPaddleY = Physics.clampPaddle(rightPaddleY, physicsConfig());
    }

    // Move the computer's left paddle to follow the ball. The paddle tracks the
    // ball's Y but only closes a fraction (AI_DIFFICULTY) of the gap each frame,
    // so it lags behind and stays beatable rather than snapping to the ball.
    // The helper clamps the result to keep the paddle on screen. Requirement 1.3.
    function moveAI() {
      leftPaddleY = Physics.aiPaddleStep(
        leftPaddleY,
        ballY,
        physicsConfig(),
        AI_DIFFICULTY
      );
    }

    // Advance the simulation by one step: move the player's paddle from input,
    // then move the ball, bounce it off the top/bottom walls (Requirement 2.2)
    // and the paddles (Requirement 2.1), and reset it to center when it leaves
    // the left/right edges (Requirement 2.3). All physics is delegated to the
    // shared pure helpers.
    function update() {
      // Always keep particles animating (they fade out even on game over).
      stepParticles();

      // When the match is over, freeze all gameplay motion.
      if (gameOver) {
        return;
      }

      movePlayer();
      moveAI();

      const config = physicsConfig();
      let ball = { x: ballX, y: ballY, dx: ballDX, dy: ballDY };

      // Move, then resolve collisions.
      ball = Physics.moveBall(ball);
      ball = Physics.bounceWall(ball, config);

      // Detect a paddle hit by checking whether bouncePaddle reversed dx, then
      // play the hit sound. Requirement: sound effect on paddle hits.
      const beforeDX = ball.dx;
      ball = Physics.bouncePaddle(ball, config);
      if (ball.dx !== beforeDX) {
        playBeep();
      }

      // Write velocity/position back to the game state.
      ballX = ball.x;
      ballY = ball.y;
      ballDX = ball.dx;
      ballDY = ball.dy;

      // If the ball left the play area, award a point to the side that didn't
      // let it through, spawn a particle burst where it exited, then re-center.
      if (Physics.isOffScreen(ball, config)) {
        const scorer = Physics.scorerFromExit(ball, config);
        // Burst near the exit point (clamp x to the canvas edge for visuals).
        const burstX = scorer === 'right' ? 0 : canvas.width;
        if (scorer === 'right') {
          rightScore += 1;
        } else if (scorer === 'left') {
          leftScore += 1;
        }
        spawnParticles(burstX, ballY);

        // Check for a winner ("First to 5 wins").
        const w = Physics.checkWinner(leftScore, rightScore, WINNING_SCORE);
        if (w) {
          winner = w;
          gameOver = true;
          frozenElapsedMs = Date.now() - gameStartTime; // freeze the timer
        } else {
          resetBall();
        }
      }
    }

    // Advance every particle one frame and drop the dead ones.
    function stepParticles() {
      particles = particles
        .map((p) => Physics.stepParticle(p))
        .filter((p) => Physics.isParticleAlive(p));
    }

    // Render a single frame: clear the canvas, then draw the ball and paddles.
    // Supports Requirement 3.1 (paddles) and 3.2 (ball). Uses the customization
    // colors (ball = white, paddles = green) on the black background.
    function draw() {
      // Clear the canvas by filling it with the background color.
      ctx.fillStyle = BACKGROUND_COLOR;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw the ball as a circle centered at (ballX, ballY).
      ctx.fillStyle = BALL_COLOR;
      ctx.beginPath();
      ctx.arc(ballX, ballY, BALL_RADIUS, 0, Math.PI * 2);
      ctx.fill();

      // Draw the paddles as rectangles.
      ctx.fillStyle = PADDLE_COLOR;
      // Left paddle (computer): flush against the left edge.
      ctx.fillRect(0, leftPaddleY, PADDLE_WIDTH, PADDLE_HEIGHT);
      // Right paddle (player): flush against the right edge.
      ctx.fillRect(canvas.width - PADDLE_WIDTH, rightPaddleY, PADDLE_WIDTH, PADDLE_HEIGHT);

      // Scoring particle burst (drawn above the play field, below the UI).
      drawParticles();

      // Fancy scoreboard: bordered score boxes + bordered timer.
      drawScoreboard();

      // Win banner when the match is over.
      if (gameOver) {
        drawWinMessage();
      }
    }

    // Draw the active scoring particles as small fading green dots.
    function drawParticles() {
      for (const p of particles) {
        // Fade alpha with remaining life (life maxes around 40 frames).
        const alpha = Math.max(0, Math.min(1, p.life / 40));
        ctx.globalAlpha = alpha;
        ctx.fillStyle = ACCENT_COLOR;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // Format a millisecond duration as M:SS.
    function formatTime(ms) {
      const totalSeconds = Math.floor(ms / 1000);
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      return minutes + ':' + String(seconds).padStart(2, '0');
    }

    // Draw a single bordered box with a label and a value, centered in the box.
    function drawBox(x, y, w, h, label, value) {
      // Box background + border.
      ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
      ctx.fillRect(x, y, w, h);
      ctx.lineWidth = 2;
      ctx.strokeStyle = ACCENT_COLOR;
      ctx.strokeRect(x, y, w, h);

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // Label (small, accent color) near the top of the box.
      ctx.fillStyle = ACCENT_COLOR;
      ctx.font = '10px monospace';
      ctx.fillText(label, x + w / 2, y + 12);

      // Value (large, white) in the lower portion.
      ctx.fillStyle = SCORE_COLOR;
      ctx.font = 'bold 20px monospace';
      ctx.fillText(value, x + w / 2, y + h - 15);
    }

    // Draw the "boxes with borders" scoreboard: computer score (left), game
    // timer (center), player score (right), across the top of the canvas.
    function drawScoreboard() {
      const boxH = 42;
      const top = 6;
      const sideW = 90;
      const timerW = 110;

      // Elapsed time: live while playing, frozen on game over.
      const elapsedMs = gameOver ? frozenElapsedMs : Date.now() - gameStartTime;

      // Left box: computer score.
      drawBox(10, top, sideW, boxH, 'COMPUTER', String(leftScore));
      // Center box: timer.
      drawBox((canvas.width - timerW) / 2, top, timerW, boxH, 'TIME', formatTime(elapsedMs));
      // Right box: player score.
      drawBox(canvas.width - 10 - sideW, top, sideW, boxH, 'PLAYER', String(rightScore));
    }

    // Draw the end-of-match banner in the fancy bordered style.
    function drawWinMessage() {
      const text = winner === 'right' ? 'Player Wins!' : 'Computer Wins!';
      const boxW = 300;
      const boxH = 90;
      const x = (canvas.width - boxW) / 2;
      const y = (canvas.height - boxH) / 2;

      ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
      ctx.fillRect(x, y, boxW, boxH);
      ctx.lineWidth = 3;
      ctx.strokeStyle = ACCENT_COLOR;
      ctx.strokeRect(x, y, boxW, boxH);

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = SCORE_COLOR;
      ctx.font = 'bold 24px monospace';
      ctx.fillText(text, canvas.width / 2, y + 32);

      ctx.fillStyle = ACCENT_COLOR;
      ctx.font = '12px monospace';
      ctx.fillText('Press Space or Enter to play again', canvas.width / 2, y + 62);
    }

    // Advance one frame: update the simulation, then render it.
    function gameLoop() {
      update();
      draw();
    }

    // Target frame rate: 60 FPS -> one frame roughly every 16ms.
    const FRAME_MS = Math.round(1000 / 60); // ~16

    // Initialize the ball at center with a random starting direction.
    resetBall();

    // Render the initial frame so the game is visible immediately on open.
    draw();

    // Start the continuous game loop. setInterval keeps calling gameLoop at
    // ~60 FPS without any user intervention, so the ball moves and paddles
    // respond on their own. Supports Requirement 3.4.
    setInterval(gameLoop, FRAME_MS);
  </script>
</body>
</html>
